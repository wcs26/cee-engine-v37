name: CEE Engine CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Lundi 6h UTC (audit hebdo dépendances)

jobs:
  test:
    name: Tests pytest (47+ endpoints)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install bandit safety coverage

      - name: Run pytest (tests locaux, pas de réseau)
        run: |
          python -m pytest tests/ -m "not network" --tb=short -q

      - name: Run pytest (réseau) — tolérance échec
        continue-on-error: true
        run: |
          python -m pytest tests/ -m "network" --tb=short -q --timeout=60

      - name: Coverage
        run: |
          coverage run -m pytest tests/ -m "not network" -q
          coverage report --fail-under=50
          coverage xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python }}
          path: coverage.xml

  security:
    name: Audit sécurité (bandit + safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Bandit (code security scan)
        run: |
          bandit -r . -f json -o bandit-report.json --skip B101,B104,B311,B501 || true
          bandit -r . --skip B101,B104,B311,B501 -ll

      - name: Safety (known CVEs in dependencies)
        continue-on-error: true
        run: |
          safety check --json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cee-engine:ci .
      - name: Test image health
        run: |
          docker run -d --name cee-test -p 5001:5001 cee-engine:ci
          sleep 8
          curl -f http://localhost:5001/health || (docker logs cee-test && exit 1)
          docker stop cee-test
