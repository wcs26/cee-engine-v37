# fly.toml app configuration file generated for cee-engine-v37 on 2026-04-21T22:52:22+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cee-engine-v37'
primary_region = 'cdg'

[build]

# V37.1 P2 — Persistance des données dossiers/conformité/post-signature.
# Sans ce volume, AHBFC + tous les dossiers sont perdus à chaque redeploy (filesystem éphémère).
# Provisioning (1x) : fly volumes create cee_data --region cdg --size 3
[env]
  CEE_DATA_DIR = '/data'
  CEE_ENV = 'prod'

[[mounts]]
  source = 'cee_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  # V37.3.47 — cap à 1 machine tant qu'on a 1 seul volume cee_data
  # (sinon une 2ᵉ machine boot sans volume = corruption JSON).
  max_machines_running = 1
  processes = ['app']

  # V37.3.47 — Healthcheck Fly natif sur /health
  # Permet à Fly de router uniquement vers une machine saine + restart auto si pendue.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# V37.3.47 — drain propre lors d'updates / restarts (vs kill brutal au milieu d'un POST)
kill_signal = "SIGTERM"
kill_timeout = "30s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
